name: Build AA Visualizer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Android project ZIP
        run: |
          mkdir source
          unzip -q AA-Visualizer-main.zip -d source
          test -f source/AA-Visualizer-main/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: source/AA-Visualizer-main
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AA-Visualizer-debug-APK
          path: source/AA-Visualizer-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
